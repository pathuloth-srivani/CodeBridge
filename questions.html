// ==================================================
// 4. GET EXAMPLE FOR SELECTED QUESTION
// ==================================================

function getQuestionExample(title, selectedTopic) {

    const topicExamples = exampleBank[selectedTopic] || {};

    if (topicExamples[title]) {
        return topicExamples[title];
    }

    return {
        input: "See the question description.",
        output: "Complete the task described in the question.",
        tests: [],
        note: "A dedicated execution test configuration is not yet available for this question."
    };
}


// ==================================================
// 5. GET QUESTIONS FOR SELECTED TOPIC
// ==================================================

const questions = questionBank[learning]?.[topic] || [];


// ==================================================
// 6. TOPIC PROGRESS STORAGE
// ==================================================

const progressKey =
    "completed_" + learning + "_" + language + "_" + topic;

localStorage.setItem(
    "totalQuestions_" + progressKey,
    questions.length
);


// ==================================================
// 7. LOAD COMPLETED QUESTIONS
// ==================================================

let completedQuestions = [];

try {

    completedQuestions = JSON.parse(
        localStorage.getItem(progressKey) || "[]"
    );

    if (!Array.isArray(completedQuestions)) {
        completedQuestions = [];
    }

} catch (error) {

    completedQuestions = [];

}

completedQuestions = [
    ...new Set(
        completedQuestions.filter(index =>
            Number.isInteger(index) &&
            index >= 0 &&
            index < questions.length
        )
    )
];

localStorage.setItem(
    progressKey,
    JSON.stringify(completedQuestions)
);


// ==================================================
// 8. FIND FIRST INCOMPLETE QUESTION
// ==================================================

let currentIndex = 0;

while (
    currentIndex < questions.length &&
    completedQuestions.includes(currentIndex)
) {
    currentIndex++;
}


// ==================================================
// 9. DISPLAY QUESTION
// Test cases are NOT displayed on this page.
// ==================================================

function displayQuestion() {

    document.getElementById("topicTitle").textContent =
        topic + " Practice";

    if (questions.length === 0) {

        document.getElementById("questionCount").textContent =
            "No questions";

        document.getElementById("questionTitle").textContent =
            "Questions coming soon";

        document.getElementById("questionDescription").textContent =
            "Questions for " + topic + " are not available.";

        document.getElementById("startButton").style.display =
            "none";

        return;
    }

    const total = questions.length;

    const percentage = Math.round(
        (completedQuestions.length / total) * 100
    );

    document.getElementById("progressFill").style.width =
        percentage + "%";

    document.getElementById("progressPercent").textContent =
        percentage + "% Completed";


    // ALL QUESTIONS COMPLETED

    if (currentIndex >= total) {

        document.getElementById("questionCount").textContent =
            "Completed " + total + " of " + total;

        document.getElementById("difficulty").style.display =
            "none";

        document.getElementById("questionTitle").textContent =
            "Congratulations!";

        document.getElementById("questionDescription").textContent =
            "You have completed all questions in " + topic + ".";

        document.getElementById("startButton").style.display =
            "none";

        document.getElementById("completionMessage").textContent =
            "Great job! Keep learning.";

        return;
    }


    // DISPLAY CURRENT QUESTION

    const q = questions[currentIndex];

    document.getElementById("questionCount").textContent =
        "Question " + (currentIndex + 1) + " of " + total;

    document.getElementById("difficulty").style.display =
        "inline-block";

    document.getElementById("difficulty").textContent =
        q[2];

    document.getElementById("questionTitle").textContent =
        q[0];

    document.getElementById("questionDescription").textContent =
        q[1];

    document.getElementById("startButton").style.display =
        "inline-block";

    document.getElementById("startButton").textContent =
        "Start Question";

    document.getElementById("completionMessage").textContent = "";

}


// ==================================================
// 10. START QUESTION
// Save test cases for the Coding page.
// ==================================================

function startQuestion() {

    if (currentIndex >= questions.length) {
        return;
    }

    const q = questions[currentIndex];

    const example = getQuestionExample(q[0], topic);

    localStorage.setItem("selectedQuestion", q[0]);

    localStorage.setItem("questionDescription", q[1]);

    localStorage.setItem("selectedQuestionIndex", currentIndex);

    localStorage.setItem("questionProgressKey", progressKey);

    localStorage.setItem("totalQuestions", questions.length);


    // Save original input and output.

    localStorage.setItem("sampleInput", example.input);

    localStorage.setItem("expectedOutput", example.output);


    // Save question-specific test cases for coding.html.

    localStorage.setItem(
        "questionTestCases",
        JSON.stringify(example.tests)
    );


    // Save whether this question has runnable test cases.

    localStorage.setItem(
        "hasExecutionTests",
        example.tests.length > 0 ? "true" : "false"
    );


    // Save selected category and topic.

    localStorage.setItem("learning", learning);

    localStorage.setItem("language", language);

    localStorage.setItem("selectedTopic", topic);


    // Clear previous quiz status.

    localStorage.removeItem("logicQuizCompleted");

    window.location.href = "understanding.html";

}


// ==================================================
// 11. GO BACK TO TOPICS
// ==================================================

function goBack() {

    window.location.href = "topics.html";

}


// ==================================================
// 12. LOAD PAGE
// ==================================================

if (!learning || !topic) {

    document.getElementById("questionTitle").textContent =
        "Please select a topic";

    document.getElementById("questionDescription").textContent =
        "Go to the dashboard and select a learning category and topic.";

    document.getElementById("startButton").style.display =
        "none";

} else {

    displayQuestion();

}
